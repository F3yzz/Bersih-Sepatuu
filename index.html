/* ===== Alur pemesanan (pilih layanan -> salin -> Google Form) ===== */
.ord-page { background: linear-gradient(180deg, #f1f6f2 0, #f8faf7 380px); padding-top: 42px; }
.ord-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.ord-back { border: 0; background: white; border: 1px solid var(--line); color: var(--navy); border-radius: 30px; padding: 10px 16px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; transition: .2s; }
.ord-back:hover { background: var(--mint); border-color: var(--mint-dark); }
.flow-steps { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 10px; }
.flow-step { display: flex; align-items: center; gap: 9px; color: #8b9a9c; font-size: 13px; font-weight: 600; }
.flow-step span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: white; border: 1.5px solid var(--line); font-size: 12px; font-weight: 800; }
.flow-step:not(:last-child)::after { content: ''; width: 28px; height: 2px; background: var(--line); border-radius: 2px; margin-left: 4px; }
.flow-step.current { color: var(--navy); }
.flow-step.current span { background: var(--navy); border-color: var(--navy); color: white; box-shadow: 0 0 0 4px rgba(149,210,183,.45); }
.flow-step.done { color: #4f8f6f; }
.flow-step.done span { background: var(--mint); border-color: var(--mint-dark); color: #2f6e51; }
.flow-step.done::after { background: var(--mint-dark); }

.ord-title { margin: 38px 0 34px; max-width: 720px; }
.ord-page .ord-title h1 { font: 700 clamp(34px, 4.4vw, 54px)/1.08 'Manrope'; letter-spacing: -2.4px; color: var(--navy); margin: 12px 0 14px; }
.ord-title h1 em { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; color: #6f8680; letter-spacing: -1.5px; }
.ord-title p { color: #78888b; line-height: 1.7; font-size: 15px; }

.ord-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; align-items: start; }
.ord-main { display: grid; gap: 20px; }
.ord-block { background: white; border: 1px solid var(--line); border-radius: 22px; padding: 26px; box-shadow: 0 1px 0 rgba(23,52,64,.03), 0 18px 40px -28px rgba(23,52,64,.25); transition: opacity .25s; }
.ord-block.muted { opacity: .55; }
.ord-block-head { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
.ord-block-head > span { width: 34px; height: 34px; border-radius: 12px; background: var(--mint); color: var(--navy); display: grid; place-items: center; font: 800 14px 'Manrope'; flex: none; }
.ord-block-head h2 { font: 700 19px 'Manrope'; color: var(--navy); letter-spacing: -.5px; }
.ord-block-head p { color: #7d8d90; font-size: 13px; margin-top: 3px; }
.ord-group-label { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; color: #98a6a6; text-transform: uppercase; margin: 6px 0 10px; }
.ord-item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.ord-item-grid.three { grid-template-columns: repeat(3, 1fr); margin-bottom: 0; }

.ord-item, .ord-service { position: relative; text-align: left; background: #fbfcfa; border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; color: var(--navy); transition: border-color .18s, transform .18s, box-shadow .18s, background .18s; }
.ord-item:hover:not(:disabled), .ord-service:hover:not(:disabled) { border-color: var(--mint-dark); transform: translateY(-2px); box-shadow: 0 12px 24px -16px rgba(23,52,64,.4); }
.ord-item b, .ord-service b { font: 700 15px 'Manrope'; letter-spacing: -.3px; padding-right: 26px; }
.ord-item small, .ord-service small { color: #7d8d90; font-size: 12px; line-height: 1.45; display: flex; align-items: center; gap: 5px; }
.ord-from, .ord-price { margin-top: 8px; font-weight: 800; font-size: 13px; color: #4f8f6f; }
.ord-price { font: 800 16px 'Manrope'; color: var(--navy); }
.ord-check { position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: white; display: grid; place-items: center; opacity: 0; transform: scale(.6); transition: .18s; }
.ord-item.selected, .ord-service.selected { background: #eef8f2; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(149,210,183,.5); }
.ord-item.selected .ord-check, .ord-service.selected .ord-check { opacity: 1; transform: scale(1); }
.ord-service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.ord-service { gap: 6px; }
.ord-service:disabled { cursor: not-allowed; opacity: .6; }
.ord-service-icon { width: 38px; height: 38px; border-radius: 12px; background: var(--mint); display: grid; place-items: center; color: var(--navy); margin-bottom: 4px; }

.ord-qty-row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.ord-qty { display: inline-flex; align-items: center; background: #f3f6f3; border: 1px solid var(--line); border-radius: 40px; padding: 5px; }
.ord-qty button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: white; color: var(--navy); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(23,52,64,.1); }
.ord-qty button:disabled { opacity: .4; cursor: not-allowed; }
.ord-qty output { min-width: 52px; text-align: center; font: 800 20px 'Manrope'; color: var(--navy); }
.ord-subtotal small { display: block; color: #8b9a9c; font-size: 11px; letter-spacing: .5px; }
.ord-subtotal b { font: 800 20px 'Manrope'; color: var(--navy); }
.ord-add { margin-left: auto; border: 1.5px dashed var(--mint-dark); background: #f4fbf7; color: #3f7d5f; border-radius: 30px; padding: 12px 18px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
.ord-add:hover:not(:disabled) { background: var(--mint); }
.ord-add:disabled { opacity: .5; cursor: not-allowed; }

.ord-summary { position: sticky; top: 98px; background: var(--navy); color: white; border-radius: 26px; padding: 26px; box-shadow: 0 30px 60px -30px rgba(23,52,64,.7); }
.ord-sum-head { display: flex; justify-content: space-between; align-items: flex-start; }
.ord-sum-head h3 { font: 700 24px 'Manrope'; letter-spacing: -.8px; margin-top: 6px; }
.ord-sum-head button { border: 0; background: rgba(255,255,255,.1); color: #cfe9dc; border-radius: 20px; padding: 7px 12px; font-size: 11px; font-weight: 700; }
.ord-sum-head button:hover { background: rgba(255,255,255,.18); }
.ord-sum-list { margin: 20px 0; display: grid; gap: 10px; max-height: 340px; overflow: auto; }
.ord-sum-empty { text-align: center; padding: 26px 10px; color: #a9c3b8; font-size: 13px; line-height: 1.6; border: 1.5px dashed rgba(255,255,255,.2); border-radius: 16px; }
.ord-sum-empty svg { width: 34px; height: 34px; margin-bottom: 10px; color: #7fbf9f; }
.ord-line { background: rgba(255,255,255,.07); border-radius: 14px; padding: 14px; }
.ord-line.draft { background: rgba(149,210,183,.14); border: 1.5px dashed rgba(149,210,183,.55); }
.ord-line-top { display: flex; justify-content: space-between; gap: 10px; }
.ord-line-top b { display: block; font-size: 14px; }
.ord-line-top small { display: block; color: #a9c3b8; font-size: 11.5px; margin-top: 3px; }
.ord-line-top > button { border: 0; background: transparent; color: #a9c3b8; padding: 4px; height: fit-content; }
.ord-line-top > button:hover { color: #ffb4a8; }
.ord-draft-tag { display: block; font-size: 9px; letter-spacing: 1.4px; font-weight: 800; color: #95d2b7; margin-bottom: 4px; }
.ord-line-bottom { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; color: #a9c3b8; }
.ord-line-bottom strong { margin-left: auto; color: white; font: 800 14px 'Manrope'; }
.ord-mini-qty { display: inline-flex; align-items: center; background: rgba(255,255,255,.1); border-radius: 20px; }
.ord-mini-qty button { width: 26px; height: 26px; border: 0; background: transparent; color: white; display: grid; place-items: center; border-radius: 50%; }
.ord-mini-qty button:disabled { opacity: .35; }
.ord-mini-qty output { min-width: 22px; text-align: center; font-weight: 800; font-size: 13px; }
.ord-sum-foot { border-top: 1px solid rgba(255,255,255,.14); padding-top: 18px; }
.ord-eta { display: flex; align-items: center; gap: 8px; color: #a9c3b8; font-size: 12.5px; }
.ord-eta b { margin-left: auto; color: white; }
.ord-total { display: flex; align-items: flex-end; justify-content: space-between; margin: 16px 0 18px; }
.ord-total span { color: #a9c3b8; font-size: 12.5px; }
.ord-total strong { font: 800 30px 'Manrope'; letter-spacing: -1px; color: #caead9; }
.ord-continue { width: 100%; border: 0; border-radius: 30px; background: var(--mint); color: var(--navy); padding: 16px; font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: .2s; }
.ord-continue:hover:not(:disabled) { background: #e3f5ec; transform: translateY(-2px); }
.ord-continue:disabled { opacity: .4; cursor: not-allowed; }
.ord-sum-foot p { margin-top: 14px; font-size: 11px; line-height: 1.55; color: #8fb0a2; }
.ord-mobilebar { display: none; }

/* ----- Halaman konfirmasi ----- */
.cf-layout { grid-template-columns: minmax(0, 1fr) 430px; }
.cf-order { background: white; border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: 0 18px 40px -28px rgba(23,52,64,.25); }
.cf-order-head { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.cf-order-head h2 { font: 700 22px 'Manrope'; color: var(--navy); letter-spacing: -.6px; margin-top: 6px; }
.cf-count { background: var(--mint); color: var(--navy); font-weight: 800; font-size: 12px; padding: 7px 13px; border-radius: 20px; }
.cf-lines { display: grid; }
.cf-line { display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: center; padding: 18px 0; border-bottom: 1px solid #edf1ee; }
.cf-num { width: 34px; height: 34px; border-radius: 50%; background: #f0f5f1; color: var(--navy); display: grid; place-items: center; font: 800 13px 'Manrope'; }
.cf-line-info b { display: block; font: 700 16px 'Manrope'; color: var(--navy); letter-spacing: -.3px; }
.cf-line-info small { color: #7d8d90; font-size: 12.5px; }
.cf-line-price { text-align: right; }
.cf-line-price small { display: block; color: #8b9a9c; font-size: 12px; }
.cf-line-price b { font: 800 16px 'Manrope'; color: var(--navy); }
.cf-totals { margin-top: 20px; background: #f3f8f4; border-radius: 16px; padding: 18px 20px; display: grid; gap: 12px; }
.cf-totals > div { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; color: #5f7076; }
.cf-totals b { color: var(--navy); }
.cf-totals .grand { padding-top: 12px; border-top: 1px dashed var(--mint-dark); }
.cf-totals .grand strong { font: 800 28px 'Manrope'; letter-spacing: -1px; color: var(--navy); }
.cf-note { margin-top: 16px; font-size: 12px; color: #8b9a9c; line-height: 1.6; }

.cf-action { background: white; border: 1px solid var(--line); border-radius: 26px; padding: 26px; box-shadow: 0 30px 60px -34px rgba(23,52,64,.45); }
.cf-action-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.cf-action-head.second { margin-top: 24px; }
.cf-action-head h3 { font: 700 18px 'Manrope'; color: var(--navy); letter-spacing: -.5px; }
.cf-badge { background: var(--navy); color: #caead9; font-size: 9.5px; font-weight: 800; letter-spacing: 1.4px; padding: 6px 10px; border-radius: 20px; }
.cf-preview { margin: 0; background: #f6f8f6; border: 1px solid var(--line); border-radius: 14px; padding: 16px; font: 500 12.5px/1.65 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; color: #2b4350; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; user-select: all; }
.cf-copy { margin-top: 14px; width: 100%; border: 0; border-radius: 16px; background: var(--navy); color: white; padding: 17px; font-weight: 800; font-size: 15.5px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: .2s; }
.cf-copy:hover { background: #244c5b; transform: translateY(-2px); }
.cf-copy.copied { background: #2f9467; }
.cf-fail { margin-top: 10px; font-size: 12px; color: #b3412f; line-height: 1.5; }

.cf-reminder { margin-top: 16px; display: flex; gap: 14px; align-items: flex-start; background: #fff3cf; border: 2px solid #f2b930; border-radius: 16px; padding: 16px 18px; color: #6b4600; animation: cf-pulse 1.8s ease-in-out infinite; }
.cf-reminder-icon { width: 44px; height: 44px; flex: none; border-radius: 50%; background: #f2b930; color: #4d3200; display: grid; place-items: center; }
.cf-reminder b { display: block; font: 800 16px/1.3 'Manrope'; letter-spacing: -.3px; color: #5c3b00; }
.cf-reminder p { margin-top: 6px; font-size: 13px; line-height: 1.55; }
.cf-reminder.done { background: #e6f6ee; border-color: #6cc39a; color: #1f5e41; animation: none; }
.cf-reminder.done .cf-reminder-icon { background: #6cc39a; color: #0f3f29; }
.cf-reminder.done b { color: #17543a; }
@keyframes cf-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(242,185,48,.5); } 50% { box-shadow: 0 0 0 9px rgba(242,185,48,0); } }

.cf-form { width: 100%; border: 2px solid var(--navy); border-radius: 16px; background: white; color: var(--navy); padding: 16px; font-weight: 800; font-size: 15.5px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: .2s; }
.cf-form:hover { background: var(--mint); }
.cf-form.ready { background: var(--navy); color: white; }
.cf-form.ready:hover { background: #244c5b; transform: translateY(-2px); }
.cf-hint { margin-top: 12px; font-size: 12px; color: #8b9a9c; text-align: center; line-height: 1.55; }

@media (max-width: 1000px) {
  .ord-layout, .cf-layout { grid-template-columns: 1fr; }
  .ord-summary { position: static; }
}
@media (max-width: 900px) {
  .ord-page { padding-bottom: 110px; }
  .ord-sum-foot .ord-continue { display: none; }
  .ord-mobilebar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(255,255,255,.96); backdrop-filter: blur(14px); border-top: 1px solid var(--line); box-shadow: 0 -12px 30px -18px rgba(23,52,64,.4); }
  .ord-mobilebar small { display: block; color: #8b9a9c; font-size: 11px; }
  .ord-mobilebar strong { font: 800 19px 'Manrope'; color: var(--navy); }
  .ord-mobilebar button { border: 0; border-radius: 28px; background: var(--navy); color: white; padding: 14px 22px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; }
  .ord-mobilebar button:disabled { opacity: .4; }
  .cf-page { padding-bottom: 70px; }
}
@media (max-width: 640px) {
  .flow-step b { display: none; }
  .flow-step.current b { display: inline; }
  .flow-step:not(:last-child)::after { width: 16px; }
  .ord-block { padding: 20px 16px; border-radius: 18px; }
  .ord-item-grid, .ord-item-grid.three, .ord-service-grid { grid-template-columns: 1fr; }
  .ord-add { margin-left: 0; width: 100%; justify-content: center; }
  .ord-page .ord-title h1 { letter-spacing: -1.6px; }
  .cf-order, .cf-action { padding: 20px 16px; border-radius: 20px; }
  .cf-line { grid-template-columns: 30px 1fr; }
  .cf-line-price { grid-column: 2; text-align: left; display: flex; justify-content: space-between; align-items: center; }
}

.hero-image-wrap img{display:block;object-position:72% 50%}
</style>
